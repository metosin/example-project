name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep in sync with the Dockerfile base image and dependency-submission.yml
  JAVA_VERSION: 17
  CLOJURE_CLI_VERSION: 1.12.7.1681
  BB_VERSION: 1.13.230
  NODE_VERSION: 24

jobs:
  lint:
    name: clj-kondo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup clj-kondo
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          clj-kondo: 2026.10.26
      - name: Lint
        run: clj-kondo --lint src test

  test-clj:
    name: Clojure tests
    runs-on: ubuntu-latest
    services:
      # Same database as compose.yaml, so the default config.edn works
      db:
        image: postgres:16.2
        ports:
          - 8532:5432
        env:
          POSTGRES_USER: example
          POSTGRES_PASSWORD: example
          POSTGRES_DB: example
        options: >-
          --health-cmd "pg_isready -U example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-
      - name: Create test template database
        run: bb init-test-db
      - name: Run tests
        run: bb test

  test-cljs:
    name: ClojureScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-cljs-
      - name: Install node deps
        run: npm ci
      - name: Run tests in headless Chrome (Karma)
        run: npm run test-karma

  build:
    name: Build uberjar (incl. frontend release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-build-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - name: Install node deps
        run: npm ci
      - name: Build
        run: bb build
